name: mod-build

# 个人二改构建与发布：push 跑上游同款宿主回归测试并用真机时序 sdkconfig.defaults 编译；
# 手动 dispatch 指定版本号（X.Y.Z-rcNNN-modM）时，测试+编译通过后把最小 OTA feed
# （update.json + 固件 bin）部署到自己的 GitHub Pages，并做发布后线上自检。
# Personal mod build and release: pushes run the upstream host regression suite and build with
# the real-board sdkconfig.defaults; a manual dispatch with a version (X.Y.Z-rcNNN-modM)
# additionally deploys the minimal OTA feed (update.json + app image) to our GitHub Pages after
# tests and build pass, then verifies the live endpoints.
# 不用 GitHub Releases 直链当下载地址：OTA 客户端禁用跟随重定向，Releases 会 302。
# Never use GitHub Releases links as download URLs: they 302 and the OTA client never follows redirects.
# 触发方式（重要）：本文件只存在于二改分支，默认分支 main 是上游镜像、故意不收录它，
# 所以 dispatch 必须显式指定分支，否则会得到 "Workflow does not have workflow_dispatch trigger"：
#   gh workflow run mod-build.yml --ref mod/glass-dock-lockoff -f version=... -f notes=...
# How to trigger: this file lives only on the mod branch (main is the upstream mirror on purpose),
# so a dispatch must name the branch explicitly or GitHub answers "Workflow does not have
# workflow_dispatch trigger" because it resolves the file on the default branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z-rcNNN-modM, e.g. 0.3.3-rc100-mod27)'
        required: true
        default: '0.3.3-rc100-mod27'
      notes:
        description: 'Release notes shown on the device (short)'
        required: false
        default: '二改 mod27：自动连接默认关闭、DNS 跟随路由器、监看密钥授权及稳定性修复'
  push:
    branches: [mod/glass-dock-lockoff]

permissions:
  contents: read

jobs:
  display-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Water-turn, display recovery, navigation and waveform regressions
        shell: bash
        run: |
          bash tools/run_water_turn_host_test.sh
          bash tools/run_display_host_test.sh
          bash tools/run_display_navigation_tests.sh
          python3 tools/pmic_gate_host_test.py
          python3 tools/boot_panel_actions_host_test.py
          python3 tools/lock_pin_host_test.py
          python3 tools/lock_screen_host_test.py
          python3 tools/settings_scroll_host_test.py
          python3 tools/pico_system_aa_host_test.py
          python3 tools/power_double_click_host_test.py
          python3 tools/pico_lock_hint_host_test.py
          python3 tools/pico_lock_wait_host_test.py
          python3 tools/pico_wake_option_host_test.py
          python3 tools/lock_feedback_host_test.py
          python3 tools/reader_refresh_release_host_test.py
          python3 tools/reader_idle_prefetch_host_test.py
          python3 tools/reader_spacing_host_test.py
          python3 tools/reader_landscape_host_test.py
          python3 tools/reader_panel_landscape_host_test.py
          python3 tools/monitor_bmp_host_test.py
          python3 tools/test_book_toc.py
          node tools/flasher_integrity_host_test.cjs
          python3 tools/vertical_punctuation_host_test.py
          python3 tools/vertical_number_host_test.py
          python3 tools/tls_bundle_host_test.py
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -Imain/book -Imain -Itools/book_layout_stubs -Itools/book_source_host_stubs tools/book_layout_host_test.c main/book/book_layout.c main/book/html_text.c -o build/book-tests/layout
          build/book-tests/layout
      - name: OTA TLS chain regression
        run: |
          # runner 系统自带的旧版 cryptography 缺 *_utc 属性；装到用户目录并优先加载。
          # The runner's stock cryptography lacks the *_utc accessors; install to the user
          # site and load it ahead of the shadowing system package.
          python3 -m pip install --quiet --user "cryptography>=42"
          PYTHONPATH="$(python3 -m site --user-site)" python3 tools/ota_tls_host_test.py

  host-management-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      # 中文：IDF 镜像没有 zlib 开发头，而 EPUB/ZIP 宿主测试的 inflate 替身
      # （tools/zip_host_stubs/miniz.h）要 #include <zlib.h>。装上开发包把测试原样跑完，
      # 不要为了少一个依赖而跳过 ZIP/EPUB 覆盖。
      # English: the IDF image ships no zlib development headers, and the EPUB/ZIP host
      # tests' inflate shim (tools/zip_host_stubs/miniz.h) includes <zlib.h>. Install the
      # headers so the tests run unchanged instead of dropping ZIP/EPUB coverage.
      - name: Install host build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zlib1g-dev

      # This suite compiles the transfer/OTA tests against IDF-managed components,
      # including cJSON. Resolve the same pinned dependencies before running it.
      - name: Resolve component dependencies
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci set-target esp32s3

      # The monolithic upstream management script still contains host tests for
      # retired UI internals. Gate releases on the maintained core tests here;
      # display, reader, lock and power regressions run in display-host-tests.
      - name: Book, EPUB, settings and input regressions
        shell: bash
        run: |
          bash tools/run_book_host_tests.sh
          python3 tools/test_book_epub.py
          mkdir -p build/book-tests/settings-card
          cc -std=gnu11 -Wall -Wextra -Werror -Itools/settings_backup_stubs \
            -Icomponents/read_pico_transfer/include \
            tools/settings_backup_host_test.c -o build/book-tests/settings-backup
          build/book-tests/settings-backup
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tools/auto_lock_host_test.c -o build/book-tests/auto-lock
          build/book-tests/auto-lock
          cc -std=gnu11 -Wall -Wextra -Werror -Itools/settings_backup_stubs \
            tools/book_history_backup_host_test.c \
            -o build/book-tests/book-history-backup
          build/book-tests/book-history-backup
          bash tools/run_text_input_host_tests.sh

      - name: Mod-specific cache, index and monitor regressions
        shell: bash
        run: |
          python3 tools/reader_landscape_host_test.py
          python3 tools/reader_panel_landscape_host_test.py
          python3 tools/shelf_categories_host_test.py
          python3 tools/shelf_cover_batch_host_test.py
          python3 tools/shelf_guard_cache_host_test.py
          python3 tools/cover_disk_cache_host_test.py
          python3 tools/cover_jobs_host_test.py
          python3 tools/book_cover_resample_host_test.py
          python3 tools/book_lock_bookmark_host_test.py
          python3 tools/quick_layer_raster_host_test.py
          cc -std=gnu11 -Wall -Wextra -Werror -Itools/mod_dns_stubs \
            -Itools/ota_stubs -Imain -Imanaged_components/espressif__cjson/cJSON \
            tools/mod_dns_host_test.c managed_components/espressif__cjson/cJSON/cJSON.c \
            -o build/book-tests/mod-dns
          build/book-tests/mod-dns
          python3 tools/monitor_bmp_host_test.py

  mod-bin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build with board sdkconfig.defaults
        shell: bash
        env:
          MOD_VERSION: ${{ github.event.inputs.version || '0.3.3-rc100-mod27' }}
        run: |
          . $IDF_PATH/export.sh
          export PICO_PROJECT_VER="$MOD_VERSION"
          python3 tools/prepare_tls_bundle.py "$IDF_PATH"
          idf.py set-target esp32s3
          idf.py build
      - name: Size report
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size
      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: mod-app-bin
          path: build/Read_Pico.bin
          if-no-files-found: error

  publish-ota:
    # 中文：只有二改分支上的手动 dispatch 才发布，避免从其它 ref 误发。
    # English: publish only from a manual dispatch on the mod branch, never from another ref.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/mod/glass-dock-lockoff'
    needs: [display-host-tests, host-management-tests, mod-bin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mod-app-bin
          path: dist
      - name: Guard against downgrades of the live feed
        env:
          MOD_VERSION: ${{ github.event.inputs.version }}
        run: python3 tools/mod_release.py guard "$MOD_VERSION"
      - name: Build the minimal OTA feed
        env:
          MOD_VERSION: ${{ github.event.inputs.version }}
          MOD_NOTES: ${{ github.event.inputs.notes }}
        run: python3 tools/mod_release.py build dist site "$MOD_VERSION" "$MOD_NOTES"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the deployed feed and image
        env:
          MOD_VERSION: ${{ github.event.inputs.version }}
        run: |
          sleep 5
          python3 tools/mod_release.py verify "$MOD_VERSION"
      - name: Upload TF-card package
        uses: actions/upload-artifact@v4
        with:
          name: Pico-update-tf
          path: site/Pico-update.bin
          if-no-files-found: error
