name: mod-build

# 个人二改构建：跑上游同款宿主回归测试，并用真机时序 sdkconfig.defaults 编出可 TF 升级的应用镜像。
# Personal mod build: run the upstream host regression suite, then produce a TF-flashable app
# image with the real-board sdkconfig.defaults timing.
# 版本号带 -mod1 后缀：设备端 TF 升级会拒绝与当前版本相同的包，环境变量注入不改代码。
# The -mod1 suffix is required because the device rejects a TF package equal to the running
# version; the environment variable injects it without touching code.

on:
  workflow_dispatch:
  push:
    branches: [mod/glass-dock-lockoff]

jobs:
  display-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Water-turn, display recovery, navigation and waveform regressions
        shell: bash
        run: |
          bash tools/run_water_turn_host_test.sh
          bash tools/run_display_host_test.sh
          bash tools/run_display_navigation_tests.sh
          python3 tools/pmic_gate_host_test.py
          python3 tools/boot_panel_actions_host_test.py
          python3 tools/lock_pin_host_test.py
          python3 tools/lock_screen_host_test.py
          python3 tools/settings_scroll_host_test.py
          python3 tools/pico_system_aa_host_test.py
          python3 tools/power_double_click_host_test.py
          python3 tools/pico_lock_hint_host_test.py
          python3 tools/pico_lock_wait_host_test.py
          python3 tools/pico_wake_option_host_test.py
          python3 tools/lock_feedback_host_test.py
          python3 tools/reader_refresh_release_host_test.py
          python3 tools/reader_idle_prefetch_host_test.py
          python3 tools/reader_spacing_host_test.py
          python3 tools/test_book_toc.py
          node tools/flasher_integrity_host_test.cjs
          python3 tools/vertical_punctuation_host_test.py
          python3 tools/vertical_number_host_test.py
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror -g -fsanitize=address,undefined -fno-omit-frame-pointer -Imain/book -Imain -Itools/book_layout_stubs -Itools/book_source_host_stubs tools/book_layout_host_test.c main/book/book_layout.c main/book/html_text.c -o build/book-tests/layout
          build/book-tests/layout

  mod-bin:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Stage board partition table
        shell: bash
        run: |
          mkdir -p boards/pico
          cp partitions.csv boards/pico/partitions.csv
      - name: Build with board sdkconfig.defaults
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          export PICO_PROJECT_VER=0.3.3-rc99-mod1
          idf.py set-target esp32s3
          idf.py build
      - name: Size report
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size
      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: Pico-update-mod1
          path: build/Read_Pico.bin
          if-no-files-found: error
